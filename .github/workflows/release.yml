name: Marketplace Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        run: bash scripts/resolveRelease.sh

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "Repository secret VSCE_PAT is required for Marketplace publishing." >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Package extension
        run: npx --no-install vsce package --out "${{ needs.version.outputs.vsix }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: gpu-fleet-viewer-${{ needs.version.outputs.version }}
          path: ${{ needs.version.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "${{ needs.version.outputs.vsix }}" --skip-duplicate

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VSIX: ${{ needs.version.outputs.vsix }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_VSIX" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_VSIX" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "GPU Fleet Viewer $RELEASE_TAG"
          fi
